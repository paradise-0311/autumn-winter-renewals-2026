name: Publish renewal dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "4,34 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy the public site and refresh its snapshots
        id: prepare
        run: |
          mkdir _site
          cp index.html dashboard.js dashboard.css teachers.css .nojekyll _site/
          if [ -f details.html ]; then
            cp details.html detail-dashboard.js detail-dashboard.css renewal-details.js renewal-detail.json _site/
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then cp snapshots.json _site/; fi
          python3 build_snapshots.py _site/snapshots.json
          if [ "$GITHUB_EVENT_NAME" = schedule ] &&
             curl --fail --silent --max-time 10 'https://paradise-0311.github.io/autumn-winter-renewals-2026/snapshots.json' -o published.json &&
             cmp -s published.json _site/snapshots.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.prepare.outputs.changed == 'true'
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        if: steps.prepare.outputs.changed == 'true'
        id: deployment
